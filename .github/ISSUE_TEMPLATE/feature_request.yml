name: Feature request
description: Suggest an idea or an improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What would you like to do?
      description: The problem or workout moment this would help with.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Idea
      description: How you imagine it working. Optional.
