name: Release

# Push a tag like v0.3.0 (matching pyproject.toml's version) to publish a
# release. Pis running BuoyCast pick it up from Settings → Software Update.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check tag matches pyproject version
        run: |
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')
          if [[ "${GITHUB_REF_NAME}" != "v${version}" ]]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match pyproject.toml version ${version}"
            exit 1
          fi

      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.6"
          python-version: "3.11"
      - run: uv sync --frozen
      - run: uv run pytest tests/ -q

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Build release tarball
        run: deploy/package.sh

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=""
          [[ "${GITHUB_REF_NAME}" == *-* ]] && prerelease="--prerelease"
          gh release create "${GITHUB_REF_NAME}" \
            --title "BuoyCast ${GITHUB_REF_NAME}" \
            --generate-notes $prerelease \
            release/buoycast-*.tar.gz \
            release/buoycast-*.tar.gz.sha256 \
            deploy/install.sh \
            deploy/update.sh
