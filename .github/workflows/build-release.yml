name: Build Pi Release Bundle

# Builds a self-contained tarball for the Raspberry Pi Zero 2W containing:
#   - Pre-built dashboard (Vite/React)
#   - Python wheel for buoycast
#   - All Python dependency wheels for aarch64 (including bleak, bless, dbus-python)
#   - systemd service file and install/update scripts
#
# The Pi downloads one tarball, installs offline, restarts — no pip/npm needed.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write # Required for creating releases

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ── Build dashboard ──────────────────────────────────────────────
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: dashboard/package-lock.json

      - name: Build dashboard
        working-directory: dashboard
        run: |
          npm ci
          npm run build

      # ── Build buoycast wheel (pure Python, platform-independent) ───
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build buoycast wheel
        run: |
          pip install build
          python -m build --wheel --outdir dist/

      # ── Download all aarch64 wheels via QEMU ───────────────────────
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Build aarch64 dependency wheels
        run: |
          mkdir -p bundle/wheels

          # Copy the buoycast wheel into the bundle
          cp dist/buoycast-*.whl bundle/wheels/

          # Use an arm64 Debian container matching Raspberry Pi OS (Bookworm)
          # to build ALL dependencies as wheels, including C extensions like
          # dbus-python. Using `pip wheel` instead of `pip download` ensures
          # everything is compiled into .whl files — no sdists that would
          # require build tools on the Pi.
          docker run --rm --platform linux/arm64 \
            -v "${{ github.workspace }}/bundle/wheels:/wheels" \
            -v "${{ github.workspace }}/dist:/dist" \
            python:3.11-slim-bookworm \
            bash -c '
              set -euo pipefail

              # System headers + build tools needed for dbus-python compilation
              apt-get update -qq
              apt-get install -y -qq gcc libdbus-1-dev libglib2.0-dev pkg-config

              # Build all dependency wheels for aarch64
              # pip wheel compiles sdists into .whl files (unlike pip download
              # which may leave sdists that need building on the target)
              pip wheel \
                --wheel-dir /wheels \
                /dist/buoycast-*.whl \
                "bleak>=0.22" \
                "bless>=0.2.5" \
                "dbus-python>=1.3"

              echo "=== Wheels built ==="
              ls -lh /wheels/

              # Verify no sdists leaked through — everything must be a .whl
              if ls /wheels/*.tar.gz 1>/dev/null 2>&1; then
                echo "ERROR: sdists found in wheels directory!"
                ls /wheels/*.tar.gz
                exit 1
              fi
            '

      # ── Assemble the bundle ────────────────────────────────────────
      - name: Assemble release bundle
        run: |
          # Dashboard
          cp -r dashboard/dist bundle/dashboard-dist

          # Deployment files
          cp buoycast.service bundle/
          cp install.sh bundle/
          cp update.sh bundle/
          cp config.toml.example bundle/

          # Version marker
          VERSION="${GITHUB_REF_NAME:-dev}"
          echo "$VERSION" > bundle/VERSION

          # Create tarball
          tar -czf "buoycast-${VERSION}.tar.gz" -C bundle .

          echo "Bundle contents:"
          tar -tzf "buoycast-${VERSION}.tar.gz" | head -40
          echo "Bundle size: $(du -h "buoycast-${VERSION}.tar.gz" | cut -f1)"

      # ── Upload as release artifact (tag pushes) ────────────────────
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: buoycast-*.tar.gz
          generate_release_notes: true

      # ── Upload as workflow artifact (manual runs / PRs) ────────────
      - name: Upload workflow artifact
        if: "!startsWith(github.ref, 'refs/tags/')"
        uses: actions/upload-artifact@v4
        with:
          name: buoycast-bundle
          path: buoycast-*.tar.gz
          retention-days: 7
