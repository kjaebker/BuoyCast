name: Build Dashboard

# Builds the Vite dashboard on proper hardware (not Pi Zero 2W) and commits
# the compiled dist/ back to the branch so the Pi only needs `git pull`.
on:
  workflow_dispatch: # Allow manual trigger from GitHub Actions UI

  push:
    branches: [main]
    paths:
      - "dashboard/src/**"
      - "dashboard/public/**"
      - "dashboard/index.html"
      - "dashboard/package.json"
      - "dashboard/package-lock.json"
      - "dashboard/vite.config.ts"
      - "dashboard/tsconfig*.json"
      - "dashboard/tailwind.config.*"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          # Need full history so we can push back to the branch
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: dashboard/package-lock.json

      - name: Install dependencies
        working-directory: dashboard
        run: npm ci

      - name: Build dashboard
        working-directory: dashboard
        run: npm run build

      - name: Commit built dist
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f dashboard/dist/
          git diff --staged --quiet && echo "No dist changes, skipping commit" && exit 0
          git commit -m "chore: build dashboard [skip ci]"
          git push origin HEAD
