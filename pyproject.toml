[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "buoycast"
version = "0.1.0"
description = "Raspberry Pi bridge for WaterRower S4 — BLE FTMS, live dashboard, Strava upload"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "aiosqlite>=0.21",
    "pyserial>=3.5",
    "httpx>=0.28",
    "structlog>=24.4",
    "garmin-fit-sdk>=21.158",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "pytest-mock>=3.14",
    "ruff>=0.9",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["error"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]
